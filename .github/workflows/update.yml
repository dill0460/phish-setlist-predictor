name: Refresh setlist data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild from the latest setlists
        env:
          PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}
        run: python build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --staged --quiet; then
            echo "No new shows — nothing to commit."
          else
            git commit -m "Refresh setlist data ($(date -u +%Y-%m-%d))"
            git push
          fi
